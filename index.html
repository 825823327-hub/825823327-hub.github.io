<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ObenMind - AI思维导图</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
            background: #f5f7fa;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
        }
        h1 {
            color: #1a1a2e;
            margin-bottom: 16px;
        }
        .tag {
            background: #e8f4fd;
            color: #0066cc;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 24px;
        }
        .price {
            font-size: 32px;
            font-weight: bold;
            color: #1a1a2e;
            margin: 24px 0;
        }
        .btn {
            background: #07c160;
            color: white;
            padding: 12px 32px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            font-weight: 500;
            margin: 8px;
        }
        .footer {
            margin-top: 40px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="tag">即将上线</div>
        <h1>ObenMind · AI思维导图</h1>
        <p>一款智能、高效的思维导图工具，助你理清思路、提升效率。</p>
        <p>会员付费 · 无限节点 · 云端同步</p>
        <div class="price">
            ¥29 <span style="font-size: 16px;">/月</span>
        </div>
        <div>
            <span class="btn" style="background: #ddd; color: #333; cursor: not-allowed;">微信支付</span>
        </div>
        <div class="footer">
            上海奥本启智科技有限公司<br>
            <a href="#" style="color: #666;">关于我们</a> | 
            <a href="#" style="color: #666;">隐私政策</a>
        </div>
    </div>
</body>
</html>
